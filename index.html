<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Isac Web</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

header {
    background: linear-gradient(135deg, #111, #333);
    color: white;
    text-align: center;
    padding: 25px 15px;
}

header h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

header p {
    color: #ccc;
}

.container {
    max-width: 800px;
    margin: auto;
    padding: 20px;
}

.caixa {
    background: white;
    padding: 20px;
    margin: 20px 0;
    border-radius: 16px;
    box-shadow: 0 3px 12px #ddd;
}

input,
textarea,
select {
    width: 100%;
    padding: 13px;
    margin: 7px 0;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
}

textarea {
    resize: vertical;
}

.botao {
    border: none;
    background: #111;
    color: white;
    padding: 12px 18px;
    border-radius: 10px;
    margin: 5px;
    cursor: pointer;
    font-size: 15px;
}

.secundario {
    background: #555;
}

.vermelho {
    background: #c62828;
}

.verde {
    background: #16803c;
}

.oculto {
    display: none;
}

.servicos {
    display: grid;
    gap: 15px;
}

.anuncio {
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 3px 10px #ddd;
}

.anuncio h3 {
    margin-bottom: 8px;
}

.anuncio p {
    margin: 7px 0;
    color: #555;
}

.usuario {
    background: #eee;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 15px;
}

.mensagem {
    padding: 10px;
    margin: 8px 0;
    border-radius: 10px;
    background: #eee;
}

.mensagem.eu {
    background: #dcecff;
    text-align: right;
}

.aviso {
    padding: 13px;
    margin-top: 12px;
    border-radius: 10px;
    font-weight: bold;
}

.sucesso {
    background: #e5f7e8;
    color: #176b27;
}

.erro {
    background: #ffe5e5;
    color: #a51d1d;
}

footer {
    text-align: center;
    padding: 30px;
    color: #777;
}
</style>
</head>

<body>

<header>

<h1>🌐 Isac Web</h1>

<p>Encontre serviços e pessoas</p>

<div style="margin-top:15px;">

<button class="botao" onclick="abrirConta()">
👤 Criar conta
</button>

<button class="botao" onclick="abrirLogin()">
🔐 Entrar
</button>

<button
id="botaoSair"
class="botao vermelho oculto"
onclick="sair()">
🚪 Sair
</button>

</div>

</header>


<div class="container">


<!-- UTILIZADOR LOGADO -->

<div id="usuarioArea" class="caixa oculto">

<div id="dadosUsuario"></div>

</div>


<!-- PESQUISA -->

<div class="caixa">

<h2>🔎 Procurar serviço</h2>

<input
id="pesquisa"
type="text"
placeholder="Ex.: técnico, explicador, designer..."
onkeyup="pesquisar()">

</div>


<!-- CATEGORIAS -->

<div class="caixa">

<h2>📂 Categorias</h2>

<div style="margin-top:15px;">

<button class="botao secundario"
onclick="filtrarCategoria('Tecnologia')">
💻 Tecnologia
</button>

<button class="botao secundario"
onclick="filtrarCategoria('Educação')">
📚 Educação
</button>

<button class="botao secundario"
onclick="filtrarCategoria('Técnico')">
🔧 Técnico
</button>

<button class="botao secundario"
onclick="mostrarTodos()">
🌐 Todos
</button>

</div>

</div>


<!-- SERVIÇOS -->

<div class="caixa">

<h2>📋 Serviços disponíveis</h2>

<div
id="listaServicos"
class="servicos"
style="margin-top:15px;">
</div>

</div>


<!-- DETALHES -->

<div
id="detalhes"
class="caixa oculto">
</div>


<!-- PUBLICAR -->

<div
id="publicarArea"
class="caixa oculto">

<h2>➕ Publicar serviço</h2>

<input
id="nomeServico"
type="text"
placeholder="Nome do serviço">

<input
id="categoriaServico"
type="text"
placeholder="Categoria">

<textarea
id="descricaoServico"
rows="4"
placeholder="Descreva o seu serviço"></textarea>

<input
id="localServico"
type="text"
placeholder="Localização">

<button
class="botao verde"
onclick="publicarServico()">
Publicar serviço
</button>

<div id="resultadoPublicacao"></div>

</div>


<!-- CONTA -->

<div
id="contaArea"
class="caixa oculto">

<h2>👤 Criar conta</h2>

<input
id="nomeConta"
type="text"
placeholder="Seu nome">

<input
id="emailConta"
type="email"
placeholder="Seu e-mail">

<input
id="senhaConta"
type="password"
placeholder="Criar palavra-passe">

<button
class="botao"
onclick="criarConta()">
Criar conta
</button>

<div id="resultadoConta"></div>

</div>


<!-- LOGIN -->

<div
id="loginArea"
class="caixa oculto">

<h2>🔐 Entrar</h2>

<input
id="emailLogin"
type="email"
placeholder="Seu e-mail">

<input
id="senhaLogin"
type="password"
placeholder="Sua palavra-passe">

<button
class="botao"
onclick="entrar()">
Entrar
</button>

<div id="resultadoLogin"></div>

</div>


<!-- CHAT -->

<div
id="chatArea"
class="caixa oculto">

<h2>💬 Conversa</h2>

<div
id="nomeChat"
style="margin:10px 0;font-weight:bold;">
</div>

<div
id="mensagens"
style="margin-top:15px;">
</div>

<textarea
id="textoMensagem"
rows="3"
placeholder="Escreva a sua mensagem..."></textarea>

<button
class="botao"
onclick="mandarMensagem()">
Enviar
</button>

<button
class="botao secundario"
onclick="fecharChat()">
Fechar
</button>

</div>


</div>


<footer>

<p>🌐 Isac Web</p>

<p style="margin-top:8px;">
Plataforma de serviços
</p>

</footer>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    setDoc,
    getDoc,
    collection,
    addDoc,
    serverTimestamp,
    onSnapshot,
    query,
    orderBy
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyChCyX9PcZri9HBD2HcVp3A8n1hE0cCCDg",

    authDomain: "isac-wep.firebaseapp.com",

    projectId: "isac-wep",

    storageBucket: "isac-wep.firebasestorage.app",

    messagingSenderId: "630487196101",

    appId: "1:630487196101:web:c2a4384c05778978076bac"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


let usuarioAtual = null;

let chatAtual = null;

let cancelarMensagens = null;


/* =========================
   UTILIZADOR
========================= */

onAuthStateChanged(auth, async (usuario) => {

    usuarioAtual = usuario;

    if (usuario) {

        document
        .getElementById("botaoSair")
        .classList
        .remove("oculto");

        document
        .getElementById("usuarioArea")
        .classList
        .remove("oculto");

        document
        .getElementById("publicarArea")
        .classList
        .remove("oculto");


        const referencia =
            doc(db, "users", usuario.uid);

        const documento =
            await getDoc(referencia);


        let nome = usuario.email;


        if (documento.exists()) {

            nome =
                documento.data().nome || nome;

        }


        document
        .getElementById("dadosUsuario")
        .innerHTML =
        "<div class='usuario'>" +
        "👋 Olá, <strong>" +
        escaparHTML(nome) +
        "</strong><br>" +
        "📧 " +
        escaparHTML(usuario.email) +
        "</div>";


    } else {

        document
        .getElementById("botaoSair")
        .classList
        .add("oculto");

        document
        .getElementById("usuarioArea")
        .classList
        .add("oculto");

        document
        .getElementById("publicarArea")
        .classList
        .add("oculto");

    }

});


/* =========================
   CRIAR CONTA
========================= */

window.criarConta = async function() {

    const nome =
        document
        .getElementById("nomeConta")
        .value
        .trim();

    const email =
        document
        .getElementById("emailConta")
        .value
        .trim();

    const senha =
        document
        .getElementById("senhaConta")
        .value;


    const resultado =
        document
        .getElementById("resultadoConta");


    if (!nome || !email || !senha) {

        resultado.className = "aviso erro";

        resultado.innerText =
            "⚠️ Preencha todos os campos.";

        return;
    }


    if (senha.length < 6) {

        resultado.className = "aviso erro";

        resultado.innerText =
            "⚠️ A palavra-passe deve ter pelo menos 6 caracteres.";

        return;
    }


    try {

        const resultadoFirebase =
            await createUserWithEmailAndPassword(
                auth,
                email,
                senha
            );


        const usuario =
            resultadoFirebase.user;


        await setDoc(
            doc(db, "users", usuario.uid),
            {
                nome: nome,
                email: email,
                createdAt: serverTimestamp()
            }
        );


        resultado.className =
            "aviso sucesso";

        resultado.innerText =
            "✅ Conta criada com sucesso!";


        document
        .getElementById("nomeConta")
        .value = "";

        document
        .getElementById("emailConta")
        .value = "";

        document
        .getElementById("senhaConta")
        .value = "";


    } catch (erro) {

        resultado.className =
            "aviso erro";

        resultado.innerText =
            mensagemErroFirebase(erro);

    }

};


/* =========================
   LOGIN
========================= */

window.entrar = async function() {

    const email =
        document
        .getElementById("emailLogin")
        .value
        .trim();

    const senha =
        document
        .getElementById("senhaLogin")
        .value;

    const resultado =
        document
        .getElementById("resultadoLogin");


    if (!email || !senha) {

        resultado.className =
            "aviso erro";

        resultado.innerText =
            "⚠️ Preencha o e-mail e a palavra-passe.";

        return;
    }


    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            senha
        );


        resultado.className =
            "aviso sucesso";

        resultado.innerText =
            "✅ Entrou com sucesso!";


        document
        .getElementById("emailLogin")
        .value = "";

        document
        .getElementById("senhaLogin")
        .value = "";


    } catch (erro) {

        resultado.className =
            "aviso erro";

        resultado.innerText =
            mensagemErroFirebase(erro);

    }

};


/* =========================
   SAIR
========================= */

window.sair = async function() {

    await signOut(auth);

    fecharChat();

};


/* =========================
   PUBLICAR SERVIÇO
========================= */

window.publicarServico = async function() {

    if (!usuarioAtual) {

        alert("Entre na sua conta primeiro.");

        return;
    }


    const nome =
        document
        .getElementById("nomeServico")
        .value
        .trim();

    const categoria =
        document
        .getElementById("categoriaServico")
        .value
        .trim();

    const descricao =
        document
        .getElementById("descricaoServico")
        .value
        .trim();

    const local =
        document
        .getElementById("localServico")
        .value
        .trim();


    const resultado =
        document
        .getElementById("resultadoPublicacao");


    if (!nome || !categoria || !descricao) {

        resultado.className =
            "aviso erro";

        resultado.innerText =
            "⚠️ Preencha nome, categoria e descrição.";

        return;
    }


    try {

        await addDoc(
            collection(db, "services"),
            {
                nome: nome,
                categoria: categoria,
                descricao: descricao,
                local: local,
                ownerId: usuarioAtual.uid,
                ownerEmail: usuarioAtual.email,
                createdAt: serverTimestamp()
            }
        );


        resultado.className =
            "aviso sucesso";

        resultado.innerText =
            "✅ Serviço publicado!";


        document
        .getElementById("nomeServico")
        .value = "";

        document
        .getElementById("categoriaServico")
        .value = "";

        document
        .getElementById("descricaoServico")
        .value = "";

        document
        .getElementById("localServico")
        .value = "";

    } catch (erro) {

        resultado.className =
            "aviso erro";

        resultado.innerText =
            "⚠️ Não foi possível publicar o serviço.";

        console.log(erro);

    }

};


/* =========================
   CARREGAR SERVIÇOS
========================= */

const consultaServicos =
    query(
        collection(db, "services"),
        orderBy("createdAt", "desc")
    );


onSnapshot(
    consultaServicos,
    (snapshot) => {

        const lista =
            document.getElementById("listaServicos");

        lista.innerHTML = "";


        if (snapshot.empty) {

            lista.innerHTML =
                "<p>Ainda não existem serviços publicados.</p>";

            return;
        }


        snapshot.forEach((docFirebase) => {

            const servico =
                docFirebase.data();


            const div =
                document.createElement("div");

            div.className =
                "anuncio";


            div.dataset.nome =
                (servico.nome || "").toLowerCase();

            div.dataset.categoria =
                (servico.categoria || "").toLowerCase();


            div.innerHTML =

                "<h3>🔹 " +
                escaparHTML(servico.nome) +
                "</h3>" +

                "<p>📂 " +
                escaparHTML(servico.categoria) +
                "</p>" +

                "<p>📝 " +
                escaparHTML(servico.descricao) +
                "</p>" +

                "<p>📍 " +
                escaparHTML(servico.local || "Não informado") +
                "</p>" +

                "<button class='botao' " +
                "onclick=\"abrirServico('" +
                escaparJS(docFirebase.id) +
                "')\">" +
                "Ver serviço" +
                "</button>";


            lista.appendChild(div);

        });

    }
);


/* =========================
   VER SERVIÇO
========================= */

window.abrirServico = async function(id) {

    const documento =
        await getDoc(
            doc(db, "services", id)
        );


    if (!documento.exists()) {

        return;
    }


    const servico =
        documento.data();


    const detalhes =
        document.getElementById("detalhes");


    detalhes.classList.remove("oculto");


    detalhes.innerHTML =

        "<h2>📋 " +
        escaparHTML(servico.nome) +
        "</h2>" +

        "<p style='margin-top:10px'>" +
        escaparHTML(servico.descricao) +
        "</p>" +

        "<p style='margin-top:10px'>📂 " +
        escaparHTML(servico.categoria) +
        "</p>" +

        "<p style='margin-top:10px'>📍 " +
        escaparHTML(servico.local || "Não informado") +
        "</p>" +

        "<button class='botao' " +
        "onclick=\"abrirChat('" +
        escaparJS(servico.ownerId) +
        "','" +
        escaparJS(servico.nome) +
        "')\">" +
        "💬 Enviar mensagem" +
        "</button>";

};


/* =========================
   CHAT
========================= */

window.abrirChat = async function(ownerId, nomeServico) {

    if (!usuarioAtual) {

        abrirLogin();

        return;
    }


    if (ownerId === usuarioAtual.uid) {

        alert("Este serviço pertence à sua própria conta.");

        return;
    }


    const ids =
        [
            usuarioAtual.uid,
            ownerId
        ].sort();


    chatAtual =
        ids[0] + "_" + ids[1];


    const chatReferencia =
        doc(db, "chats", chatAtual);


    const chatDocumento =
        await getDoc(chatReferencia);


    if (!chatDocumento.exists()) {

        await setDoc(
            chatReferencia,
            {
                participants: ids,
                createdAt: serverTimestamp()
            }
        );

    }


    document
    .getElementById("chatArea")
    .classList
    .remove("oculto");


    document
    .getElementById("nomeChat")
    .innerText =
