<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isac Web</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}
    header{background:#111827;color:white;padding:14px 16px;position:sticky;top:0;z-index:10}
    header h1{margin:0 0 10px;font-size:22px}
    button{border:0;border-radius:8px;padding:10px 13px;cursor:pointer;background:#2563eb;color:white}
    button.secondary{background:#374151}
    button.danger{background:#dc2626}
    input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;margin:6px 0 10px;font-size:15px}
    textarea{min-height:90px;resize:vertical}
    main{max-width:900px;margin:auto;padding:16px}
    .nav,.categories{display:flex;gap:8px;flex-wrap:wrap}
    .card{background:white;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #0001}
    .hidden{display:none!important}
    .muted{color:#64748b;font-size:14px}
    .service-img{width:100%;max-height:260px;object-fit:cover;border-radius:10px}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    #messages{height:320px;overflow-y:auto;background:#eef2f7;border-radius:10px;padding:10px}
    .msg{padding:9px 11px;border-radius:10px;margin:7px 0;max-width:80%;background:white}
    .mine{margin-left:auto;background:#dbeafe}
    .error{color:#b91c1c}
    .success{color:#15803d}
  </style>
</head>
<body>

<header>
  <h1>Isac Web</h1>
  <div class="nav">
    <button onclick="mostrar('inicio')">Início</button>
    <button onclick="mostrar('publicar')">Publicar serviço</button>
    <button onclick="mostrar('mensagens')">Minhas mensagens</button>
    <button id="btnCriar" onclick="mostrar('criar')">Criar conta</button>
    <button id="btnLogin" onclick="mostrar('login')">Entrar</button>
    <button id="btnLogout" class="danger hidden" onclick="sair()">Sair</button>
  </div>
  <div id="userArea" class="muted"></div>
</header>

<main>
  <section id="inicio">
    <div class="card">
      <h2>Encontra um serviço</h2>
      <input id="pesquisa" placeholder="Pesquisar serviço..." oninput="filtrar()">
      <div class="categories">
        <button onclick="categoria='Todos';filtrar()">Todos</button>
        <button onclick="categoria='Tecnologia';filtrar()">Tecnologia</button>
        <button onclick="categoria='Educação';filtrar()">Educação</button>
        <button onclick="categoria='Técnico';filtrar()">Técnico</button>
      </div>
    </div>
    <div id="lista"></div>
  </section>

  <section id="detalhe" class="hidden">
    <div class="card" id="detalheConteudo"></div>
  </section>

  <section id="publicar" class="hidden">
    <div class="card">
      <h2>Publicar serviço</h2>
      <div id="pubAviso" class="muted">É necessário entrar na conta.</div>
      <input id="nomeServico" placeholder="Nome do serviço">
      <select id="categoriaServico">
        <option>Tecnologia</option>
        <option>Educação</option>
        <option>Técnico</option>
        <option>Outros</option>
      </select>
      <textarea id="descricaoServico" placeholder="Descrição do serviço"></textarea>
      <input id="imagemServico" placeholder="Link da imagem (opcional)">
      <button onclick="publicarServico()">Publicar</button>
      <div id="pubMsg"></div>
    </div>
  </section>

  <section id="criar" class="hidden">
    <div class="card">
      <h2>Criar conta</h2>
      <input id="nomeCriar" placeholder="Nome">
      <input id="emailCriar" type="email" placeholder="E-mail">
      <input id="senhaCriar" type="password" placeholder="Palavra-passe (mínimo 6 caracteres)">
      <button onclick="criarConta()">Criar conta</button>
      <div id="criarMsg"></div>
    </div>
  </section>

  <section id="login" class="hidden">
    <div class="card">
      <h2>Entrar</h2>
      <input id="emailLogin" type="email" placeholder="E-mail">
      <input id="senhaLogin" type="password" placeholder="Palavra-passe">
      <button onclick="entrar()">Entrar</button>
      <div id="loginMsg"></div>
    </div>
  </section>

  <section id="mensagens" class="hidden">
    <div class="card">
      <h2>Minhas mensagens</h2>
      <div id="listaChats">Entra na conta para ver as conversas.</div>
    </div>
  </section>

  <section id="chat" class="hidden">
    <div class="card">
      <h2 id="chatTitulo">Chat</h2>
      <div id="messages"></div>
      <input id="mensagemInput" placeholder="Escreve uma mensagem..." onkeydown="if(event.key==='Enter')enviarMensagem()">
      <button onclick="enviarMensagem()">Enviar</button>
      <button class="secondary" onclick="mostrar('inicio')">Voltar</button>
    </div>
  </section>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
    signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, doc, setDoc, addDoc, collection, query,
    orderBy, onSnapshot, serverTimestamp, getDocs, where
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyChCyX9PcZri9HBD2HcVp3A8n1hE0cCCDg",
    authDomain: "isac-wep.firebaseapp.com",
    projectId: "isac-wep",
    storageBucket: "isac-wep.firebasestorage.app",
    messagingSenderId: "630487196101",
    appId: "1:630487196101:web:c2a4384c05778978076bac"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let utilizador = null;
  let categoria = "Todos";
  let servicos = [];
  let chatAtual = null;
  let pararMensagens = null;

  window.mostrar = function(id){
    document.querySelectorAll("main > section").forEach(s => s.classList.add("hidden"));
    document.getElementById(id)?.classList.remove("hidden");
    if(id === "mensagens") carregarChats();
  };

  function escapeHtml(valor){
    return String(valor ?? "").replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[c]));
  }

  function erroFirebase(e){
    const map = {
      "auth/email-already-in-use":"Este e-mail já está registado.",
      "auth/invalid-email":"O e-mail não é válido.",
      "auth/weak-password":"A palavra-passe deve ter pelo menos 6 caracteres.",
      "auth/invalid-credential":"E-mail ou palavra-passe incorretos.",
      "auth/network-request-failed":"Falha de internet. Tenta novamente."
    };
    return map[e?.code] || ("Erro: " + (e?.message || "não foi possível concluir."));
  }

  window.criarConta = async function(){
    const nome = document.getElementById("nomeCriar").value.trim();
    const email = document.getElementById("emailCriar").value.trim();
    const senha = document.getElementById("senhaCriar").value;
    const msg = document.getElementById("criarMsg");
    msg.className = "";
    msg.textContent = "";

    if(!nome || !email || !senha){
      msg.className="error";
      msg.textContent="Preenche todos os campos.";
      return;
    }

    try{
      const cred = await createUserWithEmailAndPassword(auth,email,senha);
      await setDoc(doc(db,"users",cred.user.uid),{
        uid: cred.user.uid,
        nome,
        email,
        createdAt: serverTimestamp()
      });
      msg.className="success";
      msg.textContent="Conta criada com sucesso!";
      document.getElementById("senhaCriar").value="";
      setTimeout(()=>mostrar("inicio"),700);
    }catch(e){
      msg.className="error";
      msg.textContent=erroFirebase(e);
      console.error(e);
    }
  };

  window.entrar = async function(){
    const email=document.getElementById("emailLogin").value.trim();
    const senha=document.getElementById("senhaLogin").value;
    const msg=document.getElementById("loginMsg");
    try{
      await signInWithEmailAndPassword(auth,email,senha);
      msg.className="success";
      msg.textContent="Sessão iniciada.";
      setTimeout(()=>mostrar("inicio"),500);
    }catch(e){
      msg.className="error";
      msg.textContent=erroFirebase(e);
      console.error(e);
    }
  };

  window.sair = async function(){
    await signOut(auth);
    mostrar("inicio");
  };

  onAuthStateChanged(auth, user=>{
    utilizador=user;
    document.getElementById("btnCriar").classList.toggle("hidden",!!user);
    document.getElementById("btnLogin").classList.toggle("hidden",!!user);
    document.getElementById("btnLogout").classList.toggle("hidden",!user);
    document.getElementById("userArea").textContent =
      user ? "Ligado: " + user.email : "Não tens sessão iniciada.";
    document.getElementById("pubAviso").textContent =
      user ? "Podes publicar o teu serviço." : "É necessário entrar na conta.";
    if(user) carregarChats();
  });

  window.publicarServico = async function(){
    if(!utilizador){
      alert("Primeiro entra na tua conta.");
      mostrar("login");
      return;
    }

    const nome=document.getElementById("nomeServico").value.trim();
    const categoriaServico=document.getElementById("categoriaServico").value;
    const descricao=document.getElementById("descricaoServico").value.trim();
    const imagem=document.getElementById("imagemServico").value.trim();
    const msg=document.getElementById("pubMsg");

    if(!nome || !descricao){
      msg.className="error";
      msg.textContent="Preenche o nome e a descrição.";
      return;
    }

    try{
      await addDoc(collection(db,"services"),{
        nome,
        categoria:categoriaServico,
        descricao,
        imagem,
        ownerId:utilizador.uid,
        ownerEmail:utilizador.email,
        createdAt:serverTimestamp()
      });
      msg.className="success";
      msg.textContent="Serviço publicado!";
      document.getElementById("nomeServico").value="";
      document.getElementById("descricaoServico").value="";
      document.getElementById("imagemServico").value="";
    }catch(e){
      msg.className="error";
      msg.textContent=erroFirebase(e);
      console.error(e);
    }
  };

  function ouvirServicos(){
    const q=query(collection(db,"services"),orderBy("createdAt","desc"));
    onSnapshot(q,snap=>{
      servicos=snap.docs.map(d=>({id:d.id,...d.data()}));
      filtrar();
    },e=>{
      document.getElementById("lista").innerHTML =
        '<div class="card error">Não foi possível carregar os serviços.</div>';
      console.error(e);
    });
  }

  window.filtrar = function(){
    const termo=document.getElementById("pesquisa").value.toLowerCase().trim();
    const lista=document.getElementById("lista");
    const filtrados=servicos.filter(s=>{
      const texto=(s.nome+" "+s.descricao+" "+s.categoria).toLowerCase();
      return (categoria==="Todos" || s.categoria===categoria) && texto.includes(termo);
    });

    if(!filtrados.length){
      lista.innerHTML='<div class="card">Nenhum serviço encontrado.</div>';
      return;
    }

    lista.innerHTML=filtrados.map(s=>`
      <div class="card">
        ${s.imagem ? `<img class="service-img" src="${escapeHtml(s.imagem)}" alt="">` : ""}
        <h3>${escapeHtml(s.nome)}</h3>
        <div class="muted">${escapeHtml(s.categoria)}</div>
        <p>${escapeHtml(s.descricao)}</p>
        <button onclick="abrirServico('${s.id}')">Ver serviço</button>
      </div>
    `).join("");
  };

  window.abrirServico = function(id){
    const s=servicos.find(x=>x.id===id);
    if(!s)return;
    document.getElementById("detalheConteudo").innerHTML=`
      ${s.imagem ? `<img class="service-img" src="${escapeHtml(s.imagem)}" alt="">` : ""}
      <h2>${escapeHtml(s.nome)}</h2>
      <div class="muted">Categoria: ${escapeHtml(s.categoria)}</div>
      <p>${escapeHtml(s.descricao)}</p>
      <p class="muted">Prestador: ${escapeHtml(s.ownerEmail || "Utilizador")}</p>
      <div class="actions">
        ${utilizador && utilizador.uid!==s.ownerId
          ? `<button onclick="abrirChat('${s.ownerId}','${escapeHtml(s.ownerEmail || "Prestador")}')">Conversar</button>`
          : ""}
        <button class="secondary" onclick="mostrar('inicio')">Voltar</button>
      </div>
    `;
    mostrar("detalhe");
  };

  function idChat(uid1,uid2){
    return [uid1,uid2].sort().join("_");
  }

  window.abrirChat = async function(outroUid,outroEmail){
    if(!utilizador){
      alert("Entra na tua conta para conversar.");
      mostrar("login");
      return;
    }

    const chatId=idChat(utilizador.uid,outroUid);
    chatAtual=chatId;

    try{
      await setDoc(doc(db,"chats",chatId),{
        participants:[utilizador.uid,outroUid].sort(),
        participantEmails:{
          [utilizador.uid]:utilizador.email,
          [outroUid]:outroEmail
        },
        updatedAt:serverTimestamp()
      },{merge:true});

      document.getElementById("chatTitulo").textContent="Chat com "+outroEmail;
      mostrar("chat");
      ouvirMensagens();
    }catch(e){
      alert(erroFirebase(e));
      console.error(e);
    }
  };

  function ouvirMensagens(){
    if(pararMensagens) pararMensagens();
    const q=query(collection(db,"chats",chatAtual,"messages"),orderBy("createdAt","asc"));
    pararMensagens=onSnapshot(q,snap=>{
      const box=document.getElementById("messages");
      box.innerHTML=snap.docs.map(d=>{
        const m=d.data();
        const mine=m.senderId===utilizador?.uid;
        return `<div class="msg ${mine?"mine":""}">
          <div>${escapeHtml(m.text)}</div>
          <small class="muted">${escapeHtml(m.senderEmail || "")}</small>
        </div>`;
      }).join("");
      box.scrollTop=box.scrollHeight;
    });
  }

  window.enviarMensagem = async function(){
    if(!utilizador || !chatAtual)return;
    const input=document.getElementById("mensagemInput");
    const text=input.value.trim();
    if(!text)return;

    try{
      await addDoc(collection(db,"chats",chatAtual,"messages"),{
        text,
        senderId:utilizador.uid,
        senderEmail:utilizador.email,
        createdAt:serverTimestamp()
      });
      await setDoc(doc(db,"chats",chatAtual),{
        updatedAt:serverTimestamp()
      },{merge:true});
      input.value="";
    }catch(e){
      alert(erroFirebase(e));
      console.error(e);
    }
  };

  async function carregarChats(){
    const box=document.getElementById("listaChats");
    if(!utilizador){
      box.textContent="Entra na conta para ver as conversas.";
      return;
    }

    try{
      const snap=await getDocs(collection(db,"chats"));
      const chats=snap.docs.map(d=>({id:d.id,...d.data()}))
        .filter(c=>Array.isArray(c.participants) && c.participants.includes(utilizador.uid))
        .sort((a,b)=>{
          const ta=a.updatedAt?.seconds || 0;
          const tb=b.updatedAt?.seconds || 0;
          return tb-ta;
        });

      if(!chats.length){
        box.innerHTML="<p>Nenhuma conversa ainda.</p>";
        return;
      }

      box.innerHTML=chats.map(c=>{
        const outro=c.participants.find(uid=>uid!==utilizador.uid);
        const email=c.participantEmails?.[outro] || "Utilizador";
        return `<div class="card">
          <strong>${escapeHtml(email)}</strong><br>
          <button onclick="abrirChat('${escapeHtml(outro)}','${escapeHtml(email)}')">Abrir conversa</button>
        </div>`;
      }).join("");
    }catch(e){
      box.innerHTML='<p class="error">Não foi possível carregar as conversas.</p>';
      console.error(e);
    }
  }

  ouvirServicos();
</script>
</body>
  </html>
